# Financial OS - Phase 1 configuration

spring.application.name=financial-os

# SQLite database file (created automatically in project root)
spring.datasource.url=jdbc:sqlite:financial.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate dialect for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Auto-create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Ollama Configuration (AI Module - Phase 1)
ollama.baseUrl=http://localhost:11434
ollama.model=qwen:8b
ollama.timeout=300

